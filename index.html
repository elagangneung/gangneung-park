<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강릉시 도시공원 현황지도 (개략판)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--g:#2f6b4f;--g2:#e8f1ec;--ink:#1d2621;--mut:#66726b;--line:#dfe5e1;--bg:#f6f8f6;--warn:#b5532c;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}
a{color:var(--g)}
header{background:var(--g);color:#fff;padding:18px 20px 0}
.wrap{max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.3px}
header p{margin:4px 0 12px;opacity:.85;font-size:13.5px}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:8px 8px 0 0;font-size:14px;opacity:.8;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--g);opacity:1;font-weight:700}
main{padding:20px}
.note{background:#fff7ec;border:1px solid #f0d9b8;color:#7a4b1c;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:24px;color:var(--g);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mut)}
h2{font-size:18px;margin:26px 0 12px}
h3{font-size:15.5px;margin:0 0 10px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e9ece9;display:block}
.card .b{padding:12px 14px 14px}
.card .t{font-weight:700;font-size:15.5px}
.card .m{font-size:13px;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;background:var(--g2);color:var(--g);padding:2px 8px;border-radius:20px}
.tag.w{background:#fbeee8;color:var(--warn)}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--g2);color:var(--g);font-weight:500}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bar{display:grid;grid-template-columns:90px 1fr 190px;align-items:center;gap:10px;font-size:13.5px;padding:3px 0}
.bar i{display:block;height:12px;background:var(--g);border-radius:3px;opacity:.75}
.bar em{font-style:normal;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:13px;background:#fafbfa}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tools input{flex:1;min-width:200px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
.back{display:inline-block;margin-bottom:10px;font-size:14px;text-decoration:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin:0;font-size:24px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0}
ul.c{margin:0;padding-left:18px}
ul.c li{margin:3px 0}
.viewer{background:#1e2521;border-radius:12px;padding:12px;margin-top:14px}
.viewer .main{position:relative}
.viewer .main img{width:100%;border-radius:6px;display:block;background:#2a322d;aspect-ratio:16/9;object-fit:contain;max-height:72vh}
.viewer .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:0;width:42px;height:60px;font-size:22px;cursor:pointer;border-radius:6px}
.viewer .nav.l{left:6px}.viewer .nav.r{right:6px}
.viewer .cap{color:#cfd8d2;font-size:13px;margin:8px 2px;display:flex;justify-content:space-between}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.thumbs img{height:58px;border-radius:4px;cursor:pointer;opacity:.55;border:2px solid transparent;flex:none}
.thumbs img.on{opacity:1;border-color:#8fd0aa}
.pestrow{display:flex;gap:6px;flex-wrap:wrap}
.foot{color:var(--mut);font-size:12.5px;margin-top:30px;border-top:1px solid var(--line);padding-top:12px}

.mapwrap{display:grid;grid-template-columns:360px 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 190px);min-height:520px}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.side .tools{padding:10px;margin:0;border-bottom:1px solid var(--line)}
.side .tools input{min-width:0;width:100%;flex:1 1 100%}
.side .tools select{flex:1}
.plist{overflow-y:auto;flex:1}
.pi{padding:9px 12px;border-bottom:1px solid #eef1ef;cursor:pointer;display:flex;gap:9px;align-items:flex-start;font-size:14px}
.pi:hover,.pi.on{background:#f1f6f3}
.pi .dot{width:11px;height:11px;border-radius:50%;flex:none;margin-top:5px}
.pi .nm{font-weight:500}
.pi .ad{font-size:12.5px;color:var(--mut)}
.pi .na{font-size:11.5px;color:var(--warn)}
#map{height:100%;min-height:0}
.legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.2);font-size:12px;line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-popup-content{font-family:'Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.55}
.basenote{position:absolute;z-index:500;left:50%;transform:translateX(-50%);top:8px;background:#fff7ec;border:1px solid #f0d9b8;color:#7a4b1c;font-size:12.5px;padding:5px 10px;border-radius:8px;display:none}
#minimap{height:300px;border-radius:12px;border:1px solid var(--line);margin-top:14px}
@media (max-width:760px){.legend{display:none}.mapwrap{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}.side{order:2;border-right:0;max-height:none}.plist{max-height:60vh}#map{order:1;height:55vh}}
.hero{background:linear-gradient(135deg,#2f6b4f,#4f8a6b);color:#fff;border-radius:14px;padding:28px 30px;margin-bottom:18px}
.hero h2{margin:0 0 8px;font-size:24px}
.hero p{margin:6px 0;opacity:.95;font-size:15.5px;line-height:1.75}
.hero .btns{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.hero .btns a{background:#fff;color:var(--g);text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px}
.hero .btns a.o{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps .panel b{display:block;color:var(--g);margin-bottom:4px}
.cohort{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.cohort .hd{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cohort .hd b{font-size:17px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--g2);color:var(--g);padding:3px 11px;border-radius:20px;font-size:13.5px}
@media (max-width:760px){.steps{grid-template-columns:1fr}.hero{padding:22px 20px}}
.blegend{display:flex;gap:16px;font-size:12.5px;margin-bottom:10px;flex-wrap:wrap}
.blegend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.bar2{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f3f1;font-size:13.5px}
.bar2:last-child{border-bottom:0}
.bb{display:flex;flex-direction:column;gap:3px}
.br{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:center}
.br i{display:block;height:10px;background:var(--g);border-radius:3px;opacity:.8;min-width:2px}
.br.a i{background:#c08a3e}
.br em{font-style:normal;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink)}
.br em small{color:var(--mut)}
@media (max-width:760px){.br{grid-template-columns:1fr 128px}.bar2{grid-template-columns:70px 1fr}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.bar{grid-template-columns:76px 1fr 92px}}
</style>
</head>

    students: ["강민서", "강지현", "곽혜찬", "김경훈", "김성윤", "김장환", "김태연", "김택경", "김혜민", "남승민", "민경서", "박윤선", "박진영", "엄지현", "이기혁", "이우성", "이재하", "장수현", "장진영", "전계완", "홍경재", "홍성현", "홍준택"] },
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n == null ? '-' : n.toLocaleString('ko-KR', {maximumFractionDigits: 1});
const img = (id, p) => `${id <= "04" ? "" : "slides/"}${id}/p-${String(p).padStart(2,'0')}.jpg`;
const kakao = addr => 'https://map.kakao.com/?q=' + encodeURIComponent(addr.startsWith('강릉') ? addr : '강릉시 ' + addr);

// 관리대장 연결
SURV.forEach(s => { s.ledger = PARKS.find(p => p.addr.replace(/\s+/g,' ').includes(s.addrKey)); if (s.ledger) s.ledger.surveyed = s.id; });

const NOTE = `<div class="note">학생들의 현장 관찰 결과를 정리한 <b>개략판</b>입니다. 병해충 진단은 육안 관찰에 근거한 것으로 나무의사 검수 전이며, 약제명·희석배수 등 처방 내용은 싣지 않았습니다. 면적·위치는 강릉시 관리현황(2026.9) 기준입니다.</div>`;


function about(){

function home(){
  const total = PARKS.reduce((a,p)=>a+(p.area||0),0);
  const byType = {};
  PARKS.forEach(p => { const t = byType[p.type] ||= {n:0,a:0}; t.n++; t.a += p.area||0; });
  const types = Object.entries(byType).sort((a,b)=>b[1].n-a[1].n);
  const maxN = Math.max(...types.map(t=>t[1].n));
  const maxA = Math.max(...types.map(t=>t[1].a));
  const trees = SURV.reduce((a,s)=>a+s.trees.reduce((b,t)=>b+(/^\d+주$/.test(t[1])?parseInt(t[1]):0),0),0);
  return NOTE + `
  <div class="stats">
    <div class="stat"><b>183</b><span>강릉시 공원·녹지 (개소)</span></div>
    <div class="stat"><b>${fmt(Math.round(total/10000))}<small style="font-size:14px"> ha</small></b><span>전체 면적 (${fmt(total)}㎡)</span></div>
    <div class="stat"><b>${SURV.length}</b><span>학생 현장조사 공원</span></div>
    <div class="stat"><b>${fmt(trees)}</b><span>수량이 기록된 수목 (주)</span></div>
  </div>
  <h2>현장조사 공원 ${SURV.length}곳</h2>
  <div class="grid">${SURV.map(s=>`
    <a class="card" href="#park-${s.id}">
      <img loading="lazy" src="${img(s.id,s.cover)}" alt="${esc(s.name)} 조사 슬라이드">
      <div class="b">
        <div class="t">${esc(s.name)}</div>
        <div class="m">${esc(s.cat)} · ${s.ledger?fmt(s.ledger.area)+'㎡':''} · ${esc(s.surveyor)}</div>
        <div class="tags">
          <span class="tag">수목 ${s.trees.length}종</span>
          ${s.pests.length?`<span class="tag w">병해충 ${s.pests.length}건</span>`:'<span class="tag">병해충 미관찰</span>'}
          <span class="tag">관리이슈 ${s.issues.length}건</span>
        </div>
      </div>
    </a>`).join('')}
  </div>
  <h2>공원 유형별 현황 (강릉시 전체)</h2>
  <div class="bars">
    <div class="blegend"><span><i style="background:var(--g)"></i>개소 수</span><span><i style="background:#c08a3e"></i>면적</span><span style="color:var(--mut)">막대 길이는 각 항목의 최댓값 대비</span></div>
    ${types.map(([t,v])=>`
    <div class="bar2"><span class="bt">${esc(t)}</span>
      <div class="bb"><div class="br"><i style="width:${v.n/maxN*100}%"></i><em>${v.n}개소 <small>(${(v.n/PARKS.length*100).toFixed(0)}%)</small></em></div>
      <div class="br a"><i style="width:${v.a/maxA*100}%"></i><em>${fmt(Math.round(v.a))}㎡ <small>(${(v.a/total*100).toFixed(1)}%)</small></em></div></div>
    </div>`).join('')}
  </div>`;
}

function fillAll(){
  const q = $('#q').value.trim(), ty = $('#ty').value, sv = $('#sv').value;
  const rows = PARKS.filter(p => (!ty||p.type===ty) && (!sv||p.surveyed) && (!q || (p.name+p.addr).includes(q)));
  $('#cnt').textContent = `${rows.length}개소 · ${fmt(rows.reduce((a,p)=>a+(p.area||0),0))}㎡`;
  $('#tb').innerHTML = rows.map(p=>`<tr>
    <td><span class="badge">${esc(p.type)}</span></td>
    <td>${p.surveyed?`<a href="#park-${p.surveyed}"><b>${esc(p.name)}</b></a> <span class="tag">조사</span>`:esc(p.name)}</td>
    <td>${esc(p.addr)}</td><td class="n">${fmt(p.area)}</td>
    <td><a href="${kakao(p.addr)}" target="_blank" rel="noopener">지도↗</a></td></tr>`).join('');
}

  const L = s.ledger || {};
  const kv = [['공원 유형',L.type||s.cat],['관리대장명',L.name],['소재지',L.addr],['면적',L.area?fmt(L.area)+'㎡':''],['최초결정일',s.decided],['토지 소유',s.owner],['조사자',s.surveyor]].filter(r=>r[1]);
  return `<a class="back" href="#map">← 공원 지도</a> &nbsp; <a class="back" href="#home">조사 공원 목록</a>
  <div class="ph"><div><span class="badge">${esc(s.cat)}</span><h2>${esc(s.name)}</h2></div>

    <div class="panel"><h3>개요</h3><dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div class="panel"><h3>이용 현황</h3><dl class="kv">
      <dt>조사 일시</dt><dd>${esc(s.survey)}</dd><dt>이용자</dt><dd>${esc(s.users)}</dd><dt>이용 행태</dt><dd>${esc(s.behavior)}</dd></dl>

    <div class="panel"><h3>식재 수목</h3><table><tbody>${s.trees.map(t=>`<tr><td>${esc(t[0])}</td><td class="n">${esc(t[1])}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h3>시설</h3><table><tbody>${s.facilities.map(f=>`<tr><th style="width:64px;background:none">${esc(f[0])}</th><td>${esc(f[1])}</td></tr>`).join('')}</tbody></table></div>
  </div>

    <div class="panel"><h3>시설·관리 이슈</h3><ul class="c">${s.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
  </div>
  ${s.suggest.length?`<div class="panel" style="margin-top:14px"><h3>제언</h3><ul class="c">${s.suggest.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:''}`;

function viewer(s){
  let cur = 1; const v = $('#viewer');
  v.innerHTML = `<div class="main"><img id="vimg" alt="조사 슬라이드"><button class="nav l" id="vp" aria-label="이전">‹</button><button class="nav r" id="vn" aria-label="다음">›</button></div>
    <div class="cap"><span>학생 발표자료 원본</span><span id="vc"></span></div>
    <div class="thumbs" id="vt">${Array.from({length:s.pages},(_,i)=>`<img loading="lazy" data-p="${i+1}" src="${img(s.id,i+1)}" alt="${i+1}쪽">`).join('')}</div>`;
  const go = p => { cur = Math.min(Math.max(1,p), s.pages); $('#vimg').src = img(s.id,cur); $('#vc').textContent = `${cur} / ${s.pages}`;
    v.querySelectorAll('#vt img').forEach(t=>t.classList.toggle('on', +t.dataset.p===cur));
    const on = v.querySelector('#vt img.on'); if (on) on.scrollIntoView({block:'nearest',inline:'nearest'}); };
  $('#vp').onclick = () => go(cur-1); $('#vn').onclick = () => go(cur+1);
  $('#vt').onclick = e => { if (e.target.dataset.p) go(+e.target.dataset.p); };
  document.onkeydown = e => { if (!$('#viewer')) return; if (e.key==='ArrowLeft') go(cur-1); if (e.key==='ArrowRight') go(cur+1); };
  go(1);
}

function pests(){
  const m = {};
  SURV.forEach(s => s.pests.forEach(([sp,d]) => (m[sp] ||= []).push({s,d})));
  const rows = Object.entries(m).sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0],'ko'));
  return NOTE + `<h2>수종별 병해충 관찰 (${rows.length}개 수종)</h2>
  <div class="list"><table><thead><tr><th>수종</th><th>관찰 내용 · 공원</th></tr></thead><tbody>${rows.map(([sp,arr])=>`
    <tr><td style="width:130px"><b>${esc(sp)}</b><br><span style="color:var(--mut);font-size:12.5px">${arr.length}개 공원</span></td>
    <td>${arr.map(x=>`<div>${esc(x.d)} — <a href="#park-${x.s.id}">${esc(x.s.name)}</a></div>`).join('')}</td></tr>`).join('')}</tbody></table></div>`;
}
function issues(){

const COLORS = {'근린공원':'#2f7d4f','어린이공원':'#e0861a','소공원':'#7fb13a','일반소공원':'#a7c957','문화공원':'#8e5bb5','수변공원':'#2b88c8','체육공원':'#c94f4f','역사공원':'#8a6d3b','광장':'#d1a400','완충녹지':'#7d8f84','경관녹지':'#93a39a','연결녹지':'#a9b7ae'};
const col = t => COLORS[t] || '#888';
let MAP = null;
function baseLayers(){
  const vw = (layer, ext) => L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`, {maxZoom:19, minZoom:6, attribution:'© VWorld 공간정보오픈플랫폼'});
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'});
  const base = vw('Base','png'), sat = L.layerGroup([vw('Satellite','jpeg'), vw('Hybrid','png')]);
  return {base, sat, osm};
}
function attachFallback(map, layers, noteEl){
  let err = 0, ok = 0;
  layers.base.on('tileload', () => ok++);
  layers.base.on('tileerror', () => { err++; if (err >= 4 && ok === 0 && map.hasLayer(layers.base)) { map.removeLayer(layers.base); layers.osm.addTo(map); if (noteEl){ noteEl.style.display='block'; noteEl.textContent='VWorld 지도를 불러오지 못해 OpenStreetMap으로 표시합니다 (인증키의 서비스 URL 확인)'; } } });
}
function makeMap(el, opts){
  const map = L.map(el, Object.assign({zoomControl:true}, opts||{}));
  const ly = baseLayers();
  ly.base.addTo(map);
  L.control.layers({'일반지도 (VWorld)':ly.base, '항공사진 (VWorld)':ly.sat, 'OpenStreetMap':ly.osm}, null, {position:'topright'}).addTo(map);
  L.control.scale({imperial:false}).addTo(map);
  return {map, ly};
}
function mapView(){
  const types = [...new Set(PARKS.map(p=>p.type))];
  return `<div class="mapwrap">
    <div class="side">
      <div class="tools">
        <input id="mq" placeholder="공원명·지번 검색">
        <select id="mty"><option value="">전체 유형</option>${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
        <select id="msv"><option value="">전체</option><option value="y">현장조사 공원만</option></select>
      </div>
      <div style="font-size:12.5px;color:var(--mut);padding:6px 12px" id="mcnt"></div>
      <div class="plist" id="plist"></div>
    </div>
    <div style="position:relative;min-height:0"><div class="basenote" id="bnote"></div><div id="map"></div></div>
  </div>
  <p class="foot" style="margin-top:12px">위치는 강릉시 관리현황의 지번을 VWorld 지오코더로 변환한 대표 지점입니다. '일원'으로 표기된 공원은 실제 범위가 더 넓을 수 있고, <span style="color:var(--warn)">위치 근사</span> 표시는 원래 지번을 찾지 못해 인근 지번으로 잡은 곳입니다. 굵은 테두리는 학생 현장조사 공원(필지 경계 표시).</p>`;
}
let MK = {};
function initMap(){
  if (MAP) { MAP.remove(); MAP = null; }
  const {map, ly} = makeMap('map');
  MAP = map; attachFallback(map, ly, $('#bnote'));
  const pts = PARKS.filter(p=>p.lat!=null).map(p=>[p.lat,p.lng]); map.fitBounds(pts, {padding:[20,20]});
  MK = {};
  PARKS.forEach((p,i) => {
    if (p.lat == null) return;
    const sv = p.surveyed;
    const m = L.circleMarker([p.lat,p.lng], {radius: sv?9:6, color: sv?'#1b3d2b':'#fff', weight: sv?3:1.5, fillColor: col(p.type), fillOpacity: .92});
    m.bindTooltip(p.name, {direction:'top', offset:[0,-6]});
    m.bindPopup(() => popupHtml(p));
    m.on('click', () => markList(i));
    MK[i] = m; m.addTo(map);
    if (sv && POLYS[sv]) L.geoJSON({type:'MultiPolygon', coordinates:POLYS[sv]}, {style:{color:'#1b3d2b', weight:2, fillColor:col(p.type), fillOpacity:.25}, interactive:false}).addTo(map);
  });
  const lg = L.control({position:'bottomright'});
  lg.onAdd = () => { const d = L.DomUtil.create('div','legend'); d.innerHTML = Object.entries(COLORS).filter(([t])=>PARKS.some(p=>p.type===t)).map(([t,c])=>`<div><i style="background:${c}"></i>${t}</div>`).join('') + '<div><i style="background:#fff;border:3px solid #1b3d2b;width:6px;height:6px"></i>현장조사 공원</div>'; return d; };
  lg.addTo(map);
  ['#mq','#mty','#msv'].forEach(k => $(k).addEventListener('input', fillMapList));
  fillMapList();
  setTimeout(() => map.invalidateSize(), 50);
}
function popupHtml(p){
  const s = p.surveyed ? SURV.find(x=>x.id===p.surveyed) : null;
  return `<b style="font-size:15px">${esc(p.name)}</b><br><span style="color:${col(p.type)};font-weight:700">${esc(p.type)}</span> · ${fmt(p.area)}㎡<br>${esc(p.addr)}${p.approx?'<br><span style="color:#b5532c">위치 근사(인근 지번)</span>':''}
   ${s?`<div style="margin-top:6px;padding-top:6px;border-top:1px solid #eee">조사: ${esc(s.surveyor)} · 수목 ${s.trees.length}종 · 병해충 ${s.pests.length}건<br><a href="#park-${s.id}"><b>조사 결과 보기 →</b></a></div>`:''}`;
}
function fillMapList(){
  const q = $('#mq').value.trim(), ty = $('#mty').value, sv = $('#msv').value;
  const rows = PARKS.map((p,i)=>[p,i]).filter(([p]) => (!ty||p.type===ty) && (!sv||p.surveyed) && (!q || (p.name+p.addr).includes(q)));
  const vis = new Set(rows.map(r=>r[1]));
  Object.entries(MK).forEach(([i,m]) => { if (vis.has(+i)) { if (!MAP.hasLayer(m)) m.addTo(MAP); } else MAP.removeLayer(m); });
  rows.sort((a,b) => (b[0].surveyed?1:0)-(a[0].surveyed?1:0));
  $('#mcnt').textContent = `${rows.length}개소 · ${fmt(rows.reduce((a,[p])=>a+(p.area||0),0))}㎡`;
  $('#plist').innerHTML = rows.map(([p,i]) => `<div class="pi" data-i="${i}"><span class="dot" style="background:${col(p.type)};${p.surveyed?'box-shadow:0 0 0 2px #1b3d2b':''}"></span><div><div class="nm">${esc(p.name)} ${p.surveyed?'<span class="tag">조사</span>':''}</div><div class="ad">${esc(p.type)} · ${esc(p.addr)} · ${fmt(p.area)}㎡</div>${p.lat==null?'<div class="na">위치 미확정 — 지번 확인 필요</div>':p.approx?'<div class="na">위치 근사</div>':''}</div></div>`).join('');
  $('#plist').onclick = e => { const el = e.target.closest('.pi'); if (!el) return; const i = +el.dataset.i, p = PARKS[i]; markList(i); if (p.lat==null) return; MAP.flyTo([p.lat,p.lng], Math.max(MAP.getZoom(), 17), {duration:.6}); MK[i].openPopup(); if (innerWidth<760) document.getElementById('map').scrollIntoView({behavior:'smooth'}); };
}
function markList(i){ document.querySelectorAll('.pi').forEach(el => el.classList.toggle('on', +el.dataset.i===i)); const el = document.querySelector(`.pi[data-i="${i}"]`); if (el) el.scrollIntoView({block:'nearest'}); }
function miniMap(s){
  const p = s.ledger; if (!p || p.lat == null) return;
  const {map, ly} = makeMap('minimap', {scrollWheelZoom:false});
  if (MAP) { MAP.remove(); } MAP = map; attachFallback(map, ly, null);
  if (POLYS[s.id]) { const g = L.geoJSON({type:'MultiPolygon', coordinates:POLYS[s.id]}, {style:{color:'#1b3d2b', weight:3, fillColor:col(p.type), fillOpacity:.3}}).addTo(map); map.fitBounds(g.getBounds(), {padding:[30,30], maxZoom:18}); }
  else map.setView([p.lat,p.lng], 17);
  L.circleMarker([p.lat,p.lng], {radius:7, color:'#1b3d2b', weight:2, fillColor:col(p.type), fillOpacity:1}).addTo(map).bindTooltip(p.name, {permanent:true, direction:'top', offset:[0,-8]});
}

function route(){
  const h = location.hash.slice(1) || 'about';
  const view = h.startsWith('park-') ? 'home' : h;
  if (MAP && !h.startsWith('park-') && h!=='map') { MAP.remove(); MAP = null; }
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
  const app = $('#app');
  if (h.startsWith('park-')) { const id = h.slice(5); app.innerHTML = park(id); const s = SURV.find(x=>x.id===id); if (s) { viewer(s); miniMap(s); } }
  else if (h==='map') { app.innerHTML = mapView(); initMap(); }
  else if (h==='all') { app.innerHTML = all(); ['#q','#ty','#sv'].forEach(k=>$(k).addEventListener('input', fillAll)); fillAll(); }
  else if (h==='pests') app.innerHTML = pests();
  else if (h==='about') app.innerHTML = about();
  else if (h==='issues') app.innerHTML = issues();
  else app.innerHTML = home();
  app.insertAdjacentHTML('beforeend', `<p class="foot">자료: 강릉시 도시공원 및 녹지 세부 관리현황(2026.9) · 조경수목관리학 및 실습 수강생 현장조사(2026.9~10) · 지도교수 최민정. 학생 발표자료의 지도 이미지는 각 서비스(디스코, 토지이음 등) 화면을 인용한 것입니다.</p>`);
  window.scrollTo(0,0);
}
addEventListener('hashchange', route); route();
</script>
</body>
</html>
